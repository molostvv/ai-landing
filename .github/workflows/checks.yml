# Проверки на каждый push и pull request.
# Результат — на вкладке Actions репозитория и галочкой/крестиком у коммита.
name: Проверки

on:
  push:
  pull_request:

jobs:
  code:
    name: Код сайта
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Установить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      - name: Синтаксис PHP
        # ошибка показывается на нужной строке файла (аннотация GitHub)
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! out=$(php -l "$f" 2>&1); then
              line=$(printf '%s' "$out" | grep -oE 'on line [0-9]+' | grep -oE '[0-9]+' | head -1)
              echo "::error file=$f,line=${line:-1},title=Синтаксис PHP::$(printf '%s' "$out" | head -1)"
              status=1
            else
              echo "$out"
            fi
          done < <(find landing -name '*.php' -print0)
          exit $status

      - name: Синтаксис JavaScript
        run: node --check landing/assets/js/main.js

      - name: Установить Python для валидатора
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Валидатор HTML (движок W3C)
        run: |
          pip install --quiet html5validator
          html5validator --root landing/ --format text

  secrets:
    name: Поиск секретов
    runs-on: ubuntu-latest
    steps:
      - name: Получить код со всей историей
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
