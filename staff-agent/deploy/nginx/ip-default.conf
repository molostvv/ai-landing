# Сайт по IP 170.168.112.225 — сервер по умолчанию для всех запросов без известного домена.
# На сервере: /etc/nginx/conf.d/ip-default.conf (заменил landing.conf 04.10.2026).
#
# Все адреса, кроме /landing/, постоянно перенаправляются на https://staff-agent.ru с тем же путём.
# Лендинг доступен по /landing/ и закрыт от индексации.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 170.168.112.225;
    client_max_body_size 1m;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Лендинг «ИИ-агенты для повседневных задач»: ссылки в нём относительные, поэтому работает из подпапки
    location = /landing {
        return 301 /landing/;
    }

    location ^~ /landing/ {
        alias /var/www/landing/public/;
        index index.html;

        # настройки и служебные файлы наружу не отдаём
        location = /landing/config.php { return 404; }
        location = /landing/config.example.php { return 404; }
        location = /landing/README.md { return 404; }
        location ~ ^/landing/\. { return 404; }

        # PHP выполняется только для обработчика формы
        location = /landing/send.php {
            fastcgi_pass unix:/run/php-fpm/www.sock;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/landing/public/send.php;
        }
        location ~ \.php$ { return 404; }
    }

    location / {
        return 301 https://staff-agent.ru$request_uri;
    }
}
