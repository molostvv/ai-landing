# staff-agent.ru после выпуска сертификата. Основной адрес — https://staff-agent.ru,
# http:// и www → постоянный редирект 301 на него за один шаг.
# На сервере: /etc/nginx/conf.d/staff-agent.conf. Сертификат выпускает и продлевает acme.sh.

server {
    listen 80;
    listen [::]:80;
    server_name staff-agent.ru www.staff-agent.ru;

    # проверка Let's Encrypt при продлении сертификата
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://staff-agent.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.staff-agent.ru;

    ssl_certificate     /etc/nginx/ssl/staff-agent.ru.crt;
    ssl_certificate_key /etc/nginx/ssl/staff-agent.ru.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:staff_agent_ssl:1m;
    ssl_session_timeout 1d;

    return 301 https://staff-agent.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staff-agent.ru;

    ssl_certificate     /etc/nginx/ssl/staff-agent.ru.crt;
    ssl_certificate_key /etc/nginx/ssl/staff-agent.ru.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:staff_agent_ssl:1m;
    ssl_session_timeout 1d;

    include /etc/nginx/staff-agent-site.inc;
}
