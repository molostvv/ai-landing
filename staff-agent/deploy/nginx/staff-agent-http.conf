# Временный конфиг staff-agent.ru до выпуска сертификата: сайт по HTTP и проверка Let's Encrypt.
# На сервере: /etc/nginx/conf.d/staff-agent.conf. После выпуска сертификата заменяется на staff-agent.conf.

server {
    listen 80;
    listen [::]:80;
    server_name www.staff-agent.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 http://staff-agent.ru$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name staff-agent.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    include /etc/nginx/staff-agent-site.inc;
}
