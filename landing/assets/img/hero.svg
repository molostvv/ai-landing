<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460">
  <defs>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#312E81" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#A5B4FC"/>
    </marker>
  </defs>
  <g font-family="Manrope, system-ui, sans-serif">
    <ellipse cx="290" cy="236" rx="262" ry="218" fill="#EEF2FF"/>
    <circle cx="500" cy="64" r="30" fill="#E0E7FF"/>
    <circle cx="44" cy="300" r="14" fill="#E0E7FF"/>

    <!-- задача -->
    <rect x="24" y="36" width="272" height="124" rx="20" fill="#fff" filter="url(#shadow)"/>
    <rect x="44" y="56" width="78" height="24" rx="12" fill="#EEF2FF"/>
    <text x="83" y="72.5" text-anchor="middle" font-size="12" font-weight="700" fill="#4F46E5" letter-spacing=".5">ЗАДАЧА</text>
    <text x="44" y="108" font-size="16" font-weight="600" fill="#111827">Разбери почту и запиши</text>
    <text x="44" y="132" font-size="16" font-weight="600" fill="#111827">новых клиентов на четверг</text>

    <path d="M150 166C150 206 180 232 212 234" fill="none" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8" marker-end="url(#arrow)"/>

    <!-- агент -->
    <circle cx="280" cy="236" r="60" fill="url(#agent)" filter="url(#shadow)"/>
    <path d="M280 204Q283 233 312 236Q283 239 280 268Q277 239 248 236Q277 233 280 204Z" fill="#fff"/>
    <circle cx="305" cy="211" r="5" fill="#fff" opacity=".75"/>
    <circle cx="256" cy="262" r="3.5" fill="#fff" opacity=".6"/>
    <text x="280" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">ИИ-агент</text>

    <!-- подключённые сервисы -->
    <g stroke="#C7D2FE" stroke-width="2" fill="none">
      <path d="M338 222C352 196 356 186 372 180"/>
      <path d="M340 236H372"/>
      <path d="M338 250C352 276 356 286 372 292"/>
    </g>
    <g font-size="13" font-weight="600" fill="#374151">
      <rect x="372" y="163" width="112" height="34" rx="17" fill="#fff" filter="url(#shadow)"/>
      <circle cx="392" cy="180" r="5" fill="#4F46E5"/>
      <text x="404" y="184.5">Почта</text>
      <rect x="372" y="219" width="132" height="34" rx="17" fill="#fff" filter="url(#shadow)"/>
      <circle cx="392" cy="236" r="5" fill="#818CF8"/>
      <text x="404" y="240.5">Календарь</text>
      <rect x="372" y="275" width="118" height="34" rx="17" fill="#fff" filter="url(#shadow)"/>
      <circle cx="392" cy="292" r="5" fill="#A5B4FC"/>
      <text x="404" y="296.5">Таблицы</text>
    </g>

    <path d="M324 280C338 306 346 326 352 338" fill="none" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8" marker-end="url(#arrow)"/>

    <!-- результат -->
    <rect x="300" y="344" width="236" height="100" rx="20" fill="#fff" filter="url(#shadow)"/>
    <rect x="320" y="362" width="76" height="24" rx="12" fill="#DCFCE7"/>
    <text x="358" y="378.5" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" letter-spacing=".5">ГОТОВО</text>
    <g font-size="14" font-weight="600" fill="#111827">
      <circle cx="328" cy="405" r="8" fill="#DCFCE7"/>
      <path d="M324.5 405l2.5 2.5 4.5-5" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="344" y="410">Письма разобраны</text>
      <circle cx="328" cy="428" r="8" fill="#DCFCE7"/>
      <path d="M324.5 428l2.5 2.5 4.5-5" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="344" y="433">Клиенты записаны</text>
    </g>

    <!-- человек проверяет -->
    <path d="M296 394H160" fill="none" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="4 6"/>
    <circle cx="226" cy="394" r="14" fill="#fff" stroke="#C7D2FE" stroke-width="2"/>
    <path d="M220 394l4 4 8-8" fill="none" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="112" cy="384" r="42" fill="#fff" filter="url(#shadow)"/>
    <circle cx="112" cy="372" r="13" fill="#C7D2FE"/>
    <path d="M88 408c3-14 13-21 24-21s21 7 24 21" fill="#C7D2FE"/>
    <text x="112" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Вы проверяете</text>
  </g>
</svg>
